name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Contract tests
        run: forge test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx tsx --test test/*.test.ts

      - name: Verify the live deployment (no keys)
        run: npm run verify
