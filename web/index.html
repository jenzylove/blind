<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blind: sealed swaps on QoreChain</title>
    <meta name="description" content="A sealed batch exchange on QoreChain testnet. Orders are sealed in your browser with post quantum keys, the price is fixed on chain before any order can be opened, and the whole batch settles at one price." />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem("blind.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
